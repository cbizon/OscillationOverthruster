[project]
name = "sequel"
version = "0.1.0"
description = "Event-driven hard-sphere simulation of vertically oscillated granular layers"
requires-python = ">=3.12"
dependencies = [
    "numba>=0.66",
    "numpy>=2.2",
    "roborobo",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["granular"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
roborobo = { path = "../research-programs", editable = true }
