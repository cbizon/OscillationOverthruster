# Human-only. After editing: `program approve`. The rules are the fields
# below (schema: budgets.schema.json); comments give reasons, never rules.
budgets:
  # Simulation CPU time, measured from the runs, not estimated.
  cpu_hours:
    - {max: 4000, per: week, where: [local, hatteras]}
    - {max: 100, per: run, where: [local, hatteras]}
  # Includes simulations left running by earlier sessions. The Mac has 14
  # cores; 10 leaves room for Chris's own work.
  concurrent_cores:
    - {max: 10, per: instant, where: [local]}
  # The Mac has 36 GB.
  memory_gb:
    - {max: 16, per: instant, where: [local]}
  disk_free_gb:
    - {min: 40, per: instant, where: [local]}
  # Size of ~/Projects/experiments/sequel-data/, including outputs fetched
  # from Hatteras.
  disk_gb:
    - {max: 15, per: instant, where: [local]}
